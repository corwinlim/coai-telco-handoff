name: CoAi Telco Handoff CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Source and logic checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check static source
        run: node tests/source-check.js
      - name: Check business logic
        run: node tests/logic-check.js

  production-smoke:
    name: Public homepage smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On the main branch, allow Vercel time to deploy the matching push.
    if: github.event_name != 'pull_request'
    steps:
      - name: Check production HTTPS and content
        shell: bash
        run: |
          set -euo pipefail
          url='https://coai-telco-handoff.vercel.app/'
          for attempt in $(seq 1 12); do
            echo "Attempt $attempt / 12"
            if curl --fail --silent --show-error --location --max-time 15 "$url" -o /tmp/coai-home.html &&
               grep -q 'CoAi Telco Handoff' /tmp/coai-home.html &&
               grep -q 'SYNTHETIC DATA DEMO' /tmp/coai-home.html; then
              echo 'PUBLIC_HTTP_GATE=PASS'
              exit 0
            fi
            sleep 10
          done
          echo 'PUBLIC_HTTP_GATE=FAIL'
          exit 1

  production-browser-e2e:
    name: Production Chromium interaction and TXT download
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify production browser workflow
        env:
          COAI_URL: https://coai-telco-handoff.vercel.app/
        run: node tests/production-browser-e2e.cjs
